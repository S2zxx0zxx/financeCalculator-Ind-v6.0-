name: FinCalc V7 CI

on:
  push:
    branches:
      - "upgrade/fincalc-fullstack-v7"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fincalc-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, parity tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Formula parity tests
        run: npm run test:run

      - name: Production build
        run: npm run build
